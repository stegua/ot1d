name: wheels

# Builds the source distribution and the wheels (CPython 3.8 to 3.14 on Linux,
# macOS and Windows), tests every wheel, and on a version tag (v*) uploads all
# of them to PyPI by trusted publishing (no token: the publisher is configured
# on pypi.org for this repository, this workflow and the environment "pypi").

on:
  push:
    tags: [ 'v*' ]
    branches: [ develop ]
    paths: [ 'python/**', 'include/**', '.github/workflows/wheels.yml' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: the two copies of the header are the same
      run: cmp include/OT1D.hpp python/OT1D.hpp
    - name: build the source distribution
      run: pipx run build --sdist python/ --outdir dist
    - uses: actions/upload-artifact@v4
      with:
        name: cibw-sdist
        path: dist/*.tar.gz

  wheels:
    name: wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest       # Linux x86_64
        - os: ubuntu-24.04-arm    # Linux aarch64
        - os: macos-15-intel      # macOS x86_64
        - os: macos-15            # macOS arm64
        - os: windows-latest      # Windows AMD64
    steps:
    - uses: actions/checkout@v6
    - uses: pypa/cibuildwheel@v3.4.1
      with:
        package-dir: python
        output-dir: wheelhouse
    - uses: actions/upload-artifact@v4
      with:
        name: cibw-wheels-${{ matrix.os }}
        path: wheelhouse/*.whl

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [ sdist, wheels ]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v5
      with:
        pattern: cibw-*
        path: dist
        merge-multiple: true
    - uses: pypa/gh-action-pypi-publish@release/v1
